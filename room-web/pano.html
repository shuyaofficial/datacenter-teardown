<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>部屋の見回し（試作）</title>
<style>
html,body{margin:0;height:100%;background:#0d0e10;overflow:hidden;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:rgb(250 250 248 / .94);color:#1d2124;border-radius:10px;padding:6px 10px 7px;font-size:13px;line-height:1.35;box-shadow:0 2px 10px rgb(0 0 0 / .35);white-space:nowrap}
.tag b{display:block;font-size:14px}
.tag::after{content:'';position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.go{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgb(255 255 255 / .9);display:grid;place-items:center;box-shadow:0 2px 12px rgb(0 0 0 / .4);font-size:24px;color:#0f8f97}
.bar{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:rgb(250 250 248 / .95);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.55;color:#1d2124}
.bar b{color:#0f8f97}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script>
</head><body>
<div class="bar"><b>1 / 6　冷たい通路</b><br>ラックの正面がこちらを向いています。冷たい空気はここから吸い込まれ、黄色い光ファイバは天井のトレイへ上がります。</div>
<script type="module">
// 1点から描いた 360° の写真を球の内側に貼り、指で見回す。札は写真の中の方向（経度・緯度）に置く。
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const src = q.get('img') || '../teardown-out/room/pano1.webp';
const r = new THREE.WebGLRenderer({antialias: true}); r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.setSize(innerWidth, innerHeight); document.body.prepend(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 75), innerWidth / innerHeight, 0.1, 100);
const tex = await new THREE.TextureLoader().loadAsync(src); tex.colorSpace = THREE.SRGBColorSpace;
const geo = new THREE.SphereGeometry(50, 64, 32); geo.scale(-1, 1, 1);
scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: tex})));
let lon = +(q.get('lon') || 0), lat = +(q.get('lat') || 0);
const dirOf = (lo, la) => { const p = THREE.MathUtils.degToRad(90 - la), t = THREE.MathUtils.degToRad(lo);
  return new THREE.Vector3(Math.sin(p) * Math.cos(t), Math.cos(p), Math.sin(p) * Math.sin(t)); };
// 札: 写真の中の方向（試作なので手で置いた値）
const tags = [
  {lon: 170, lat: -6, html: '<b>GPU ラック（NVL72）</b>72 GPU・約120 kW'},
  {lon: 191, lat: 14, html: '<b>光ファイバ</b>ラックの外へつなぐ線'},
  {lon: 184, lat: 25, html: '<b>冷却液の配管</b>天井から各ラックへ'},
].map((t) => { const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = t.html; document.body.appendChild(el); return {...t, el}; });
const go = Object.assign(document.createElement('div'), {className: 'go', textContent: '↑'}); document.body.appendChild(go);
const goDir = {lon: 180, lat: -22};
const place = (el, lo, la) => {
  const v = dirOf(lo, la).project(camera);
  const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
  el.style.display = vis ? '' : 'none';
  el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
};
let drag = null;
r.domElement.addEventListener('pointerdown', (e) => { drag = {x: e.clientX, y: e.clientY, lon, lat}; });
addEventListener('pointermove', (e) => { if (!drag) return;
  lon = drag.lon - (e.clientX - drag.x) * 0.15; lat = Math.max(-80, Math.min(80, drag.lat + (e.clientY - drag.y) * 0.15)); });
addEventListener('pointerup', () => { drag = null; });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
const loop = () => {
  camera.lookAt(dirOf(lon, lat));
  r.render(scene, camera);
  tags.forEach((t) => place(t.el, t.lon, t.lat)); place(go, goDir.lon, goDir.lat);
  requestAnimationFrame(loop);
};
loop();
setTimeout(() => { window.READY = true; }, 400);
</script></body></html>
